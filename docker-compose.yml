services:
  postgres:
    image: postgres:16-alpine
    container_name: mexc-ticker-pg
    environment:
      POSTGRES_USER: ticker
      POSTGRES_PASSWORD: ticker
      POSTGRES_DB: ticker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticker -d ticker"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: mexc-ticker-app
    environment:
      SYMBOLS: BTCUSDT,ETHUSDT
      DATABASE_URL: postgres://ticker:ticker@postgres:5432/ticker?sslmode=disable
      HTTP_ADDR: ":8080"
      BATCH_SIZE: "100"
      FLUSH_INTERVAL: 5s
      POLL_INTERVAL: 2s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  pgdata: