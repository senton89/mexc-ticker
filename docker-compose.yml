services:
  postgres:
    image: postgres:16-alpine
    container_name: mexc-ticker-pg
    environment:
      POSTGRES_USER: ticker
      POSTGRES_PASSWORD: ticker
      POSTGRES_DB: ticker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticker -d ticker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: