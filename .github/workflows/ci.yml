name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - name: test
        run: go test -race -count=1 -timeout 120s ./...

      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/collector

      - name: docker build
        run: docker build -t mexc-ticker:ci .