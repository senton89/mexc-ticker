version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: standard        # errcheck, govet, staticcheck, unused, ineffassign
  enable:
    - errorlint            # ловит err == x вместо errors.Is и %v вместо %w
    - noctx                # http-запросы без context
    - bodyclose
    - misspell
    - gocritic
    - copyloopvar
  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/senton89/mexc-ticker